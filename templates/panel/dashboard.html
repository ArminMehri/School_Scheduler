{% extends "panel/base.html" %}
{% block title %}داشبورد{% endblock %}

{% block content %}
  <div class="mb-5">
    <h1 class="text-3xl font-black">داشبورد</h1>
    <p class="text-slate-300 mt-1">اینجا همه چیز رو سریع می‌بینی و مدیریت می‌کنی.</p>
  </div>

  <div class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">
    {% for title, count, url in stats %}
      <div class="glass rounded-3xl p-5">
        <div class="flex items-start justify-between gap-3">
          <div>
            <div class="text-slate-200 font-extrabold">{{ title }}</div>
            <div class="text-4xl font-black mt-2">{{ count }}</div>
          </div>
          <div class="h-12 w-12 rounded-2xl bg-gradient-to-br from-blue-500/70 to-indigo-500/70"></div>
        </div>

        <div class="mt-4">
          <a href="/{{ url }}" class="inline-flex items-center gap-2 px-4 py-2 rounded-2xl bg-white/10 hover:bg-white/15 transition font-bold text-sm">
            مشاهده / مدیریت
            <span class="opacity-70">←</span>
          </a>
        </div>
      </div>
    {% endfor %}
  </div>

  <div class="mt-6 glass rounded-3xl p-5 bg-gradient-to-l from-fuchsia-500/25 to-blue-500/25 border-white/15">
    <div class="text-lg font-extrabold">پیام مدیریت:</div>
    <div class="text-slate-200 mt-1 text-sm">
      سلام مدیر گرامی خسته نباشید.
    </div>
  </div>
{% endblock %}
