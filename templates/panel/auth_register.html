{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ثبت‌نام</title>
  <script src="{% static 'assets/js/sweetalert2.all.min.js' %}"></script>

  <style>
    :root{
      --bg1:#050816; --bg2:#0b1a3a;
      --card:rgba(255,255,255,.08);
      --border:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --blue1:#4f8bff; --blue2:#2f6bff;
      --shadow:0 18px 60px rgba(0,0,0,.35);
      --radius:22px;
    }
    body{
      margin:0;
      font-family:"Vazirmatn","Vazir",Tahoma,Arial,sans-serif;
      background:
        radial-gradient(1200px 600px at 80% 10%, rgba(120,90,255,.25), transparent 55%),
        radial-gradient(900px 500px at 20% 90%, rgba(70,170,255,.18), transparent 55%),
        linear-gradient(160deg,var(--bg1),var(--bg2));
      color:var(--text);
      font-size:17px;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }
    .card{
      width:min(560px, 100%);
      background: linear-gradient(180deg, var(--card), rgba(255,255,255,.06));
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
    }
    h1{margin:0 0 6px; font-size:28px;}
    .sub{color:var(--muted); margin-bottom:16px; line-height:1.9;}
    label{display:block; color:var(--muted); margin: 12px 0 6px; font-weight:700;}

    input{
      width:100%;
      border-radius:16px;
      padding:12px 14px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(10,18,40,.55);
      color:var(--text);
      outline:none;
      font-size:16px;
      box-sizing:border-box;
    }
    input::placeholder{ color: rgba(255,255,255,.45); }

    /* فقط برای مرتب شدن بخش مدرسه (تم دست نخورده) */
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .field{min-width:0;}
    .divider{
      height:1px;
      background: rgba(255,255,255,.12);
      margin: 14px 0 6px;
      border-radius:999px;
    }
    @media (max-width: 520px){
      .grid{grid-template-columns:1fr;}
    }

    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      border-radius:999px; padding:12px 18px;
      border:1px solid transparent; cursor:pointer; font-weight:800;
      text-decoration:none; user-select:none; transition:.18s ease;
      font-size:16px;
    }
    .btn-primary{
      width:100%;
      background: linear-gradient(90deg, var(--blue2), var(--blue1));
      box-shadow: 0 14px 35px rgba(60,120,255,.25);
      color:#fff;
      margin-top:16px;
    }
    .btn-primary:hover{ transform: translateY(-1px); filter:brightness(1.03); }

    .row{
      display:flex; justify-content:space-between; align-items:center;
      gap:12px; margin-top:14px; flex-wrap:wrap;
    }
    .link{color:rgba(255,255,255,.85); text-decoration:none; font-weight:700;}
    .link:hover{ text-decoration:underline; }

    .errors{
      color:#ffd1d1;
      background: rgba(255,0,0,.10);
      border: 1px solid rgba(255,0,0,.25);
      padding: 10px 12px;
      border-radius: 14px;
      margin-top: 10px;
      line-height: 1.9;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>ثبت‌نام</h1>
    <div class="sub">یک حساب بساز تا وارد پنل برنامه‌ساز بشی.</div>

    <form method="post" novalidate>
      {% csrf_token %}

      <!-- اطلاعات مدرسه -->
      <div class="grid">
        <div class="field">
          <label for="id_school_name">نام مدرسه</label>
          <input id="id_school_name" name="school_name" type="text" required
                 value="{{ request.POST.school_name|default:'' }}"
                 placeholder="مثلاً دبیرستان شهید بهشتی" />
        </div>

        <div class="field">
          <label for="id_school_code">کد آموزشگاه</label>
          <input id="id_school_code" name="school_code" type="text" required
                 value="{{ request.POST.school_code|default:'' }}"
                 placeholder="مثلاً 123456" />
        </div>

        <div class="field">
          <label for="id_education_level">مقطع تحصیلی</label>
          <input id="id_education_level" name="education_level" type="text" required
                 value="{{ request.POST.education_level|default:'' }}"
                 placeholder="مثلاً متوسطه دوم" />
        </div>

        <div class="field">
          <label for="id_manager_mobile">موبایل مدیر</label>
          <input id="id_manager_mobile" name="manager_mobile" type="tel" inputmode="tel" required
                 value="{{ request.POST.manager_mobile|default:'' }}"
                 placeholder="مثلاً 09123456789" />
        </div>

        <div class="field" style="grid-column:1 / -1;">
          <label for="id_manager_full_name">نام و نام خانوادگی مدیر</label>
          <input id="id_manager_full_name" name="manager_full_name" type="text" required
                 value="{{ request.POST.manager_full_name|default:'' }}"
                 placeholder="مثلاً علی محمدی" />
        </div>
      </div>

      <div class="divider"></div>

      <!-- اطلاعات کاربری (همون چیزی که ویوت می‌خونه) -->
      <label for="id_username">نام کاربری</label>
      <input id="id_username" name="username" type="text" autocomplete="username" required
             value="{{ request.POST.username|default:'' }}"
             placeholder="نام کاربری دلخواه" />

      <label for="id_password">رمز عبور</label>
      <input id="id_password" name="password" type="password" autocomplete="new-password" required
             placeholder="رمز عبور" />

      <label for="id_password2">تکرار رمز عبور</label>
      <input id="id_password2" name="password2" type="password" autocomplete="new-password" required
             placeholder="تکرار رمز عبور" />

      <button class="btn btn-primary" type="submit">✅ ثبت‌نام</button>
    </form>

    <div class="row">
      <a class="link" href="{% url 'panel_login' %}">ورود</a>
      <a class="link" href="{% url 'site_index' %}">بازگشت به صفحه اصلی</a>
    </div>
  </div>

<script>
  (function(){
    const msgs = [];
    {% if messages %}
      {% for message in messages %}
        msgs.push({ level: "{{ message.tags }}", text: "{{ message|escapejs }}" });
      {% endfor %}
    {% endif %}
    if (!msgs.length) return;

    const m = msgs[0];
    let icon = "info";
    if (m.level.includes("success")) icon = "success";
    if (m.level.includes("error")) icon = "error";
    if (m.level.includes("warning")) icon = "warning";

    Swal.fire({ icon, title:"پیام سیستم", text:m.text, confirmButtonText:"باشه" });
  })();
</script>

</body>
</html>
