{% extends "panel/base.html" %}
{% block title %}ثبت‌نام{% endblock %}

{% block content %}
<div class="min-h-[60vh] grid place-items-center">
  <div class="w-full max-w-md glass rounded-3xl p-7">
    <h1 class="text-3xl font-black mb-1">ثبت‌نام</h1>
    <p class="text-slate-300 text-sm mb-5">اکانت بساز تا پنل رو داشته باشی.</p>

    <form method="post" class="space-y-4">
      {% csrf_token %}
      {% for field in form %}
        <div>
          <label class="block font-extrabold mb-2">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}
            <div class="text-red-300 text-sm mt-1">{{ field.errors }}</div>
          {% endif %}
        </div>
      {% endfor %}

      <button class="w-full px-5 py-3 rounded-2xl bg-emerald-500 hover:bg-emerald-400 transition font-extrabold">
        ثبت‌نام
      </button>
    </form>
  </div>
</div>
{% endblock %}
