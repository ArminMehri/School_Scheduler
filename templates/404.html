{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>صفحه پیدا نشد | مهرگان تک</title>

  <style>
    :root{
      --bg1:#050816; --bg2:#0b1a3a;
      --card:rgba(255,255,255,.08);
      --border:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --blue1:#4f8bff; --blue2:#2f6bff;
      --green1:#19d18c; --green2:#0fb57a;
      --cyan:#35e0ff;
      --shadow:0 18px 60px rgba(0,0,0,.35);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
      font-family:"Vazirmatn","Vazir",Tahoma,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(1000px 520px at 80% 5%, rgba(53,224,255,.16), transparent 55%),
        radial-gradient(900px 500px at 15% 85%, rgba(79,139,255,.20), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
    }

    .box{
      width:100%;
      max-width:760px;
      text-align:center;
      padding:34px 24px;
      border-radius:30px;
      background:linear-gradient(180deg, var(--card), rgba(255,255,255,.055));
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      position:relative;
      overflow:hidden;
    }

    .box::before{
      content:"";
      position:absolute;
      width:300px;
      height:300px;
      top:-130px;
      left:-110px;
      background:radial-gradient(circle, rgba(53,224,255,.22), transparent 65%);
    }

    .logo{
      width:92px;
      height:74px;
      margin:0 auto 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(145deg, rgba(12,24,55,.98), rgba(5,10,25,.98));
      border:1px solid rgba(47,210,210,.35);
      border-radius:24px;
      padding:4px;
      box-shadow:
        0 12px 35px rgba(0,0,0,.35),
        0 0 22px rgba(47,210,210,.20),
        inset 0 0 14px rgba(255,255,255,.04);
      overflow:hidden;
      position:relative;
      z-index:1;
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .code{
      font-size:92px;
      line-height:1;
      font-weight:1000;
      letter-spacing:4px;
      color:transparent;
      background:linear-gradient(90deg, var(--cyan), #ffffff, var(--blue1));
      -webkit-background-clip:text;
      background-clip:text;
      text-shadow:0 0 35px rgba(53,224,255,.18);
      position:relative;
      z-index:1;
    }

    h1{
      margin:12px 0 10px;
      font-size:30px;
      position:relative;
      z-index:1;
    }

    p{
      margin:0 auto 22px;
      max-width:560px;
      color:var(--muted);
      line-height:2;
      font-size:16px;
      position:relative;
      z-index:1;
    }

    .actions{
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
      position:relative;
      z-index:1;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:999px;
      padding:12px 18px;
      border:1px solid transparent;
      color:white;
      text-decoration:none;
      font-weight:1000;
      transition:.18s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      filter:brightness(1.04);
    }

    .btn-primary{
      background:linear-gradient(90deg, var(--blue2), var(--blue1));
      box-shadow:0 14px 35px rgba(60,120,255,.22);
    }

    .btn-green{
      background:linear-gradient(90deg, var(--green2), var(--green1));
      box-shadow:0 14px 35px rgba(20,220,140,.18);
    }

    .btn-ghost{
      background:rgba(255,255,255,.07);
      border-color:rgba(255,255,255,.14);
      color:var(--text);
    }

    @media(max-width:600px){
      .code{font-size:70px}
      h1{font-size:24px}
      .box{padding:28px 18px}
    }
  </style>
</head>

<body>
  <main class="box">
    <div class="logo">
      <img src="{% static 'assets/images/Mehreganlogo.png' %}" alt="Mehrgan Tech Logo">
    </div>

    <div class="code">404</div>

    <h1>صفحه موردنظر پیدا نشد</h1>

    <p>
      آدرسی که وارد کرده‌اید وجود ندارد، حذف شده یا مسیر آن تغییر کرده است.
      از دکمه‌های زیر می‌توانید به صفحه اصلی برگردید.
    </p>

    <div class="actions">
      <a class="btn btn-green" href="{% url 'company_index' %}">صفحه اصلی مهرگان تک</a>
      <a class="btn btn-ghost" href="javascript:history.back()">بازگشت</a>
    </div>
  </main>
</body>
</html>
