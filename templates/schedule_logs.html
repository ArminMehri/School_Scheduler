{% load static %}
{% load schedule_tags %}
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <title>لاگ تولید برنامه درسی</title>
    <link rel="icon" href="{% static 'assets/images/Logo.png' %}" type="image/x-icon">
    <style>
        body { font-family: "B Titr", sans-serif; direction: rtl; padding: 20px; background: #f9f9f9; }
        h1 { text-align: center; margin-bottom: 20px; }
        ul { background: #fff; border: 1px solid #ddd; padding: 20px; list-style-type: none; }
        li { margin-bottom: 10px; padding: 10px; border-bottom: 1px solid #eee; }
        li:last-child { border-bottom: none; }
        .warning { color: #d9534f; font-weight: bold; }
        form { text-align: center; margin-top: 20px; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>لاگ تولید برنامه درسی</h1>

    <form method="post">
        {% csrf_token %}
        <button type="submit" name="generate_schedule">تولید برنامه</button>
        <button type="submit" name="clear_logs">پاک کردن لاگ‌ها</button>
    </form>

    <ul>
        {% for log in logs %}
            <li class="warning">{{ log }}</li>
        {% empty %}
            <li>لاگی موجود نیست.</li>
        {% endfor %}
    </ul>
</body>
</html>
