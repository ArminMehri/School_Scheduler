{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ثبت‌نام | مهرگان تک</title>

  <script src="{% static 'assets/js/sweetalert2.all.min.js' %}"></script>

  <style>
    :root{
      --bg1:#050816; --bg2:#0b1a3a;
      --card:rgba(255,255,255,.08);
      --border:rgba(255,255,255,.12);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.65);
      --blue1:#4f8bff; --blue2:#2f6bff;
      --green1:#19d18c; --green2:#0fb57a;
      --cyan:#35e0ff;
      --shadow:0 18px 60px rgba(0,0,0,.35);
      --radius:24px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:"Vazirmatn","Vazir",Tahoma,Arial,sans-serif;
      background:
        radial-gradient(1000px 520px at 80% 5%, rgba(53,224,255,.16), transparent 55%),
        radial-gradient(900px 500px at 15% 85%, rgba(79,139,255,.20), transparent 55%),
        linear-gradient(160deg,var(--bg1),var(--bg2));
      color:var(--text);
    }

    .card{
      width:min(520px,100%);
      padding:24px;
      border-radius:var(--radius);
      background:linear-gradient(180deg,var(--card),rgba(255,255,255,.055));
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
    }

    .logo{
      width:82px;
      height:68px;
      margin:0 auto 14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(145deg,rgba(12,24,55,.98),rgba(5,10,25,.98));
      border:1px solid rgba(47,210,210,.35);
      border-radius:22px;
      padding:3px;
      overflow:hidden;
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:contain;
    }

    h1{
      margin:0 0 8px;
      text-align:center;
      font-size:28px;
    }

    .sub{
      text-align:center;
      color:var(--muted);
      line-height:1.9;
      margin-bottom:18px;
    }

    label{
      display:block;
      margin:12px 0 6px;
      color:var(--muted);
      font-weight:800;
    }

    input{
      width:100%;
      border-radius:16px;
      padding:13px 14px;
      border:1px solid rgba(255,255,255,.18);
      background:rgba(10,18,40,.55);
      color:var(--text);
      outline:none;
      font-size:16px;
    }

    input::placeholder{
      color:rgba(255,255,255,.42);
    }

    .btn{
      width:100%;
      margin-top:16px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      border-radius:999px;
      padding:13px 18px;
      border:1px solid transparent;
      cursor:pointer;
      font-weight:1000;
      font-size:16px;
      text-decoration:none;
      color:#fff;
      transition:.18s ease;
    }

    .btn-primary{
      background:linear-gradient(90deg,var(--blue2),var(--blue1));
      box-shadow:0 14px 35px rgba(60,120,255,.25);
    }

    .btn:hover{
      transform:translateY(-1px);
      filter:brightness(1.04);
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      margin-top:16px;
    }

    .link{
      color:rgba(255,255,255,.85);
      text-decoration:none;
      font-weight:800;
    }

    .link:hover{
      text-decoration:underline;
    }
  </style>
</head>

<body>

<div class="card">

  <div class="logo">
    <img src="{% static 'assets/images/Mehreganlogo.png' %}" alt="Mehrgan Tech">
  </div>

  <h1>ثبت‌نام در مهرگان تک</h1>
  <div class="sub">
    برای استفاده از خدمات، سفارش‌ها و پنل‌های مهرگان تک یک حساب کاربری بسازید.
  </div>

  <form method="post" novalidate>
    {% csrf_token %}

    <label for="id_full_name">نام و نام خانوادگی</label>
    <input id="id_full_name" name="full_name" type="text" required
           value="{{ request.POST.full_name|default:'' }}"
           placeholder="مثلاً آرمین مهری">

    <label for="id_mobile">شماره موبایل</label>
    <input id="id_mobile" name="mobile" type="tel" inputmode="tel" required
           value="{{ request.POST.mobile|default:'' }}"
           placeholder="مثلاً 09123456789">

    <label for="id_email">ایمیل</label>
    <input id="id_email" name="email" type="email"
           value="{{ request.POST.email|default:'' }}"
           placeholder="example@gmail.com">

    <label for="id_username">نام کاربری</label>
    <input id="id_username" name="username" type="text" autocomplete="username" required
           value="{{ request.POST.username|default:'' }}"
           placeholder="نام کاربری دلخواه">

    <label for="id_password">رمز عبور</label>
    <input id="id_password" name="password" type="password" autocomplete="new-password" required
           placeholder="رمز عبور">

    <label for="id_password2">تکرار رمز عبور</label>
    <input id="id_password2" name="password2" type="password" autocomplete="new-password" required
           placeholder="تکرار رمز عبور">

    <button class="btn btn-primary" type="submit">✅ ساخت حساب کاربری</button>
  </form>

  <div class="row">
    <a class="link" href="{% url 'panel_login' %}">ورود به حساب</a>
    <a class="link" href="{% url 'company_index' %}">بازگشت به صفحه اصلی</a>
  </div>

</div>

<script>
  (function(){
    const msgs = [];
    {% if messages %}
      {% for message in messages %}
        msgs.push({ level: "{{ message.tags }}", text: "{{ message|escapejs }}" });
      {% endfor %}
    {% endif %}

    if (!msgs.length) return;

    const m = msgs[0];
    let icon = "info";
    if (m.level.includes("success")) icon = "success";
    if (m.level.includes("error")) icon = "error";
    if (m.level.includes("warning")) icon = "warning";

    Swal.fire({
      icon,
      title:"پیام سیستم",
      text:m.text,
      confirmButtonText:"باشه"
    });
  })();
</script>

</body>
</html>
